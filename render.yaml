services:
  - type: web
    name: stremio-italian-gems
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: TMDB_API_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: CUSTOM_POSTERS
        value: "1"
      - key: CATALOG_PAGE_SIZE
        value: "30"
      - key: YEARS_PER_PAGE
        value: "3"
      - key: PAGES_PER_YEAR
        value: "2"
      - key: POSTER_CONCURRENCY
        value: "3"
      - key: TMDB_CONCURRENCY
        value: "4"
      - key: NODE_OPTIONS
        value: "--use-system-ca"
      - key: DATA_CACHE_SECONDS
        value: "21600"
      - key: IT_DUB_BOOST
        value: "1"
      - key: IT_DUB_DENSITY
        value: "0.55"
      - key: IT_WATCH_OVERSAMPLE
        value: "1"
      - key: JUSTWATCH_IT_BOOST
        value: "1"
      - key: JUSTWATCH_IT_CACHE_SECONDS
        value: "86400"
      - key: NODE_VERSION
        value: "20"
