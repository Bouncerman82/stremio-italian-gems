services:
  - type: web
    name: stremio-italian-gems
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: TMDB_API_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: SHUFFLE_CACHE_HOURS
        value: "6"
      - key: CUSTOM_POSTERS
        value: "1"
      - key: NODE_VERSION
        value: "20"
