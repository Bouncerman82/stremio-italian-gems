services:
  - type: web
    name: stremio-italian-gems
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: TMDB_API_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: CUSTOM_POSTERS
        value: "1"
      - key: POSTER_CONCURRENCY
        value: "3"
      - key: TMDB_CONCURRENCY
        value: "4"
      - key: NODE_OPTIONS
        value: "--use-system-ca"
      - key: DATA_CACHE_SECONDS
        value: "21600"
      - key: NODE_VERSION
        value: "20"
